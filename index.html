<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>STILL COUNTING</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#101010;color:#f4eee8;font-family:Arial,Helvetica,sans-serif}
main{width:min(100% - 32px,460px);text-align:center;padding:30px 18px 38px}
.kicker{font-size:11px;letter-spacing:.28em;color:#aaa;margin-bottom:22px}
.heart{font-size:64px;line-height:1;color:#d82d37;text-shadow:0 0 28px #8d101a66;margin-bottom:22px}
.portrait{display:block;width:min(100%,300px);max-height:390px;object-fit:cover;object-position:center;border-radius:12px;margin:0 auto 28px;border:1px solid #542126;box-shadow:0 12px 40px #0009}
.label{color:#e1434b;font-size:12px;letter-spacing:.28em}
h1{font-size:clamp(30px,8vw,44px);letter-spacing:.06em;margin:12px 0 2px;overflow-wrap:anywhere}
.date{color:#aaa;font-size:12px;letter-spacing:.22em;margin-top:26px}
.rule{height:1px;width:90px;background:#a92630;margin:28px auto}
.footer{font-family:Georgia,serif;font-style:italic;font-size:17px;color:#eee}
.note{font-size:10px;color:#777;letter-spacing:.12em;margin-top:28px}
.music{margin:28px auto 0;max-width:320px;border:1px solid #3c2527;border-radius:14px;padding:16px;background:#151313}
.music-title{font-size:14px;color:#eee;margin-bottom:12px}
.play{border:0;border-radius:999px;background:#c93640;color:white;font-size:14px;font-weight:700;padding:12px 22px;cursor:pointer}
.play:focus-visible{outline:2px solid white;outline-offset:3px}
.music-status{font-size:11px;color:#aaa;margin-top:10px;min-height:14px}
.player{width:100%;margin-top:14px;aspect-ratio:16/9}
.player iframe{width:100%;height:100%;border:0;border-radius:8px}
@media (max-width:360px){main{padding-inline:10px}.kicker{letter-spacing:.2em}.label{letter-spacing:.2em}}
</style>
</head>
<body>
<main>
  <div class="kicker">STILL COUNTING / 001</div>
  <div class="heart" aria-label="heart">♥</div>
  <img class="portrait" src="portrait.jpg" alt="الصورة المختارة لموقع STILL COUNTING">
  <div class="label">TIME SINCE THE BEGINNING</div>
  <h1 id="minutes">LOADING</h1>
  <div class="label">MINUTES</div>
  <div class="date" id="date">28 MAY 2021</div>
  <div class="rule"></div>
  <section class="music" aria-label="Music player">
    <div class="music-title">مسلم — اتنسيت</div>
    <button class="play" id="playButton" type="button">▶ تشغيل الأغنية</button>
    <div class="music-status" id="musicStatus">اضغط لتشغيل الفيديو الرسمي من يوتيوب</div>
    <div class="player" id="player" hidden></div>
  </section>
  <div class="rule"></div>
  <div class="footer">Some things are still on their way.</div>
  <div class="note">AND COUNTING...</div>
</main>
<script>
const params = new URLSearchParams(location.search);
const raw = params.get("since") || "2021-05-28T00:00:00Z";
const start = Date.parse(raw);
const dateEl = document.getElementById("date");
const minutesEl = document.getElementById("minutes");
if (!Number.isFinite(start) || start > Date.now()) {
  minutesEl.textContent = "—";
  dateEl.textContent = "CHECK START DATE";
} else {
  dateEl.textContent = new Date(start).toLocaleDateString("en-GB", {
    day:"2-digit", month:"long", year:"numeric", timeZone:"UTC"
  }).toUpperCase();
  function tick() {
    minutesEl.textContent = Math.floor((Date.now()-start)/60000).toLocaleString("en-US");
  }
  tick();
  setInterval(tick, 1000);
}
const playButton = document.getElementById("playButton");
const player = document.getElementById("player");
const status = document.getElementById("musicStatus");
playButton.addEventListener("click", () => {
  if (!player.hasChildNodes()) {
    const frame = document.createElement("iframe");
    frame.title = "مسلم - اتنسيت";
    frame.src = "https://www.youtube-nocookie.com/embed/BGkL2Pq-g3A?autoplay=1&rel=0";
    frame.allow = "autoplay; encrypted-media; picture-in-picture; web-share";
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    frame.allowFullscreen = true;
    player.appendChild(frame);
  }
  player.hidden = false;
  playButton.textContent = "الأغنية مفتوحة";
  status.textContent = "إذا لم يبدأ التشغيل، اضغط تشغيل داخل مشغّل يوتيوب.";
});
</script>
</body>
</html>
